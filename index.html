<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <link rel="icon" type="image/png" href="estudando.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
    <button type="button" onclick="alternarTema()" class="btn-secundario btn-tema">🌓</button>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="container">
        <h1>Login ADS</h1>
        <input type="text" id="userLogin" placeholder="Usuário">
        <input type="password" id="passLogin" placeholder="Senha">
        <button type="button" onclick="realizarLogin()">Entrar</button>
        <button onclick="mostrarCadastro()" class="btn-secundario">Criar Conta</button>
    </div>

    <!-- TELA DE CADASTRO -->
    <div id="cadastro-screen" class="container" style="display: none;">
        <h1>Cadastrar</h1>
        <input type="text" id="userCad" placeholder="Novo Usuário">
        <input type="password" id="passCad" placeholder="Nova Senha">
        <button type="button" onclick="realizarCadastro()">Salvar Cadastro</button>
        <button onclick="mostrarLogin()" class="btn-secundario">Voltar</button>
    </div>

    <!-- TELA PRINCIPAL (APP) -->
    <div id="app-content" class="container">
        <h1 id="tituloApp">Gerenciador de Tarefas</h1>

        <!-- JANELA DE FOCO (Inicia escondida, aparece ao clicar na tarefa) -->
        <div id="painel-foco" style="display: none; background: #1a1a1a; border: 2px solid #ff4d4d; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center;">
            <h3 id="tarefa-ativa-nome" style="color: #ff4d4d; margin: 0;">🚀 Focando...</h3>
            <div id="timer" style="font-size: 3rem; font-weight: bold; color: #ff4d4d; margin: 10px 0;">00:00</div>
            <!-- Dentro da div painel-foco -->
            <div style="margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <span>🔈</span>
                <input type="range" id="volumeControl" min="0" max="1" step="0.1" value="0.5" style="width: 100px; margin: 0;">
                <span>🔊</span>
            </div>

            <button type="button" onclick="pararFoco()" class="btn-limpar" style="width: auto; padding: 5px 20px;">Parar e Fechar</button>
        </div>

        <!-- Barra de Progresso -->
        <div class="progress-container"><div id="progress-bar"></div></div>

        <!-- Cadastro de Nova Tarefa -->
        <input type="text" id="taskInput" placeholder="O que vamos estudar?">
        
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <select id="taskCategory" style="flex: 2; margin-bottom: 0;">
                <option value="Estudo">📚 Estudo</option>
                <option value="Urgente">🚨 Urgente</option>
                <option value="Lazer">🎮 Lazer</option>
            </select>
            <div style="flex: 1; display: flex; align-items: center; background: #2d2d2d; border-radius: 6px; padding-right: 10px; border: 1px solid #333;">
                <input type="number" id="focoEstimado" value="25" min="1" max="120" style="border: none; margin-bottom: 0; background: transparent;">
                <span style="font-size: 0.7rem; color: #888;">min</span>
            </div>
        </div>

        <button type="button" onclick="salvar()">Adicionar Tarefa</button>
        
        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

        <ul id="lista"></ul>

        <button type="button" onclick="limparTudo()" class="btn-limpar">Limpar Tudo</button>
        <button type="button" onclick="sair()" class="btn-secundario">Sair</button>
    </div>

    <script src="script.js"></script>
</body>

<footer style="margin-top: 20px; font-size: 0.6rem; color: #555;">
  <a href="https://www.flaticon.com/br/icones-gratis/estude" title="estude ícones"
    style="color: #555; text-decoration: none;">
    Ícone por Freepik - Flaticon
  </a>
</footer>

</html>
